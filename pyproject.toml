[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-text-hashing"
version = "0.1.0"
description = "A Survey on Deep Text Hashing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scikit-learn>=1.4.2",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "torchmetrics>=1.3.1",
    "torchvision>=0.17.0",
    "tqdm>=4.66.2",
    "dotmap>=1.3.30",
    "nltk>=3.9.1",
]

[tool.setuptools.packages.find]
include = ["textdata*", "utils*"]

